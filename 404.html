<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Room 38</title>
<meta name="description" content="That page isn't here. Find your way to We're Building, a Room 38 event.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160f0a">
<link rel="icon" href="/assets/images/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#160f0a;--ink-soft:#261b13;--paper:#f7f1eb;--white:#fff;--brown:#7d6d60;--pad:clamp(1.25rem,5vw,3rem)}
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0}
  body{min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
  nav{width:100%;max-width:1080px;margin:0 auto;padding:1.1rem var(--pad)}
  .mark{display:inline-flex;align-items:center;gap:.7rem;text-decoration:none;font-family:"Inter Tight",Inter,sans-serif;font-weight:800;font-size:.82rem;letter-spacing:.24em;text-transform:uppercase}
  .mark img{height:32px;width:auto}
  main{flex:1;display:flex;align-items:center;width:100%;max-width:1080px;margin:0 auto;padding:3rem var(--pad) 5rem}
  .label{font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brown)}
  h1{font-family:"Inter Tight",Inter,sans-serif;font-size:clamp(2.8rem,11vw,6rem);font-weight:800;line-height:.92;letter-spacing:-.04em;text-transform:uppercase;margin:1rem 0 1.4rem}
  p.lead{font-size:clamp(1.05rem,2.6vw,1.25rem);max-width:34ch;margin-bottom:2rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 1.9rem;background:var(--ink);color:var(--white);text-decoration:none;
    font-family:"Inter Tight",Inter,sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);transition:background .2s}
  .btn:hover{background:var(--ink-soft)}
</style>
</head>
<body>
  <nav aria-label="Room 38">
    <a class="mark" href="/" aria-label="Room 38 home"><img src="/assets/images/door-mark.png" width="82" height="96" alt=""><span>Room 38</span></a>
  </nav>
  <main>
    <div>
      <p class="label">Page not found</p>
      <h1>This page<br>isn't here.</h1>
      <p class="lead">The link may be old. Everything happening right now is on the homepage.</p>
      <a class="btn" href="/">Go to We're Building</a>
    </div>
  </main>
</body>
</html>
