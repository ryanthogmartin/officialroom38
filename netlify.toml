# Netlify configuration for officialroom38.com
# This file is honored when the project folder is dragged into Netlify
# or connected via Git.

[build]
  # No build step — this is a static site.
  publish = "."

# The site is now a single page (We're Building). Links to the previous
# site's pages, and the event's originally planned /werebuilding URL,
# all land on the homepage.
[[redirects]]
  from = "/werebuilding"
  to = "/"
  status = 301

[[redirects]]
  from = "/werebuilding/"
  to = "/"
  status = 301

[[redirects]]
  from = "/worship"
  to = "/"
  status = 301

[[redirects]]
  from = "/worship/"
  to = "/"
  status = 301

[[redirects]]
  from = "/worship.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/week-one"
  to = "/"
  status = 301

[[redirects]]
  from = "/week-one/"
  to = "/"
  status = 301

[[redirects]]
  from = "/week-one.html"
  to = "/"
  status = 301

# Branded custom 404 for any unmatched path.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
